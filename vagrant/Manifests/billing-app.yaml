apiVersion: v1
kind: Service
metadata:
  name: billing-app
  namespace: movie-platform
spec:
  selector:
    app: billing-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-app
  namespace: movie-platform
spec:
  serviceName: billing-app
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      containers:
        - name: billing-app
          image: admary/billing-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Postgres connection (matching your docker-compose)
            - name: PGHOST
              value: "billing-db"
            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: billing-db-secret
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: billing-db-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-db-secret
                  key: POSTGRES_PASSWORD

            # RabbitMQ connection (matching your docker-compose)
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: AMQP_URL
            - name: RABBIT_QUEUE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBIT_QUEUE

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
